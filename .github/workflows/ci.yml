name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Mathlib's compiled files take most of the runner's disk; remove preinstalled toolchains
      # that the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      # `lake build` builds only the modules of lean4-phylogenetics that this library imports; the
      # audit reads all of them.
      - name: Build the library that the audit reads
        run: lake build Phylogenetics
      # The audit sees a module's proofs only through its own `import all` line.
      - name: Check that the audit imports every module of the libraries
        run: python3 scripts/gen_audit.py --check
      - name: Audit the axioms
        run: lake env lean scripts/Audit.lean
      # The README's tables are generated from catalog/papers.toml by the root's tools.
      - name: Check that the README is current
        run: |
          git clone --depth 1 https://github.com/formal-phylogenetics/lean4-phylogenetics \
            ../lean4-phylogenetics
          python3 ../lean4-phylogenetics/scripts/status.py readme --check --repo lean4-phylo-statistics --fetch-hubs
