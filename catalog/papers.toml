# The papers of this hub, one [[paper]] per repository to be, grouped by family: the statistical
# limits of phylogenetic inference, its consistency and sample complexity, and the asymptotics of
# its tests.
#
# Started on 2026-11-25 from the maintainer's division of the collection into hubs of inference and
# hubs of theory. Authors, years, titles and links were checked against Crossref. Each formalization
# records the exact citation in its Phase 0, and corrects the entry here.
#
# Fields of a paper:
#   id          the repository is lean4-<id>: the method's name in lower case when the paper names
#               one, otherwise first author and year, with a keyword when two papers would share it
#   family      the [[family]] it belongs to (each paper is in exactly one)
#   order       its place in the family, by priority
#   short       the method's name, when it has one
#   kind        "theory" (a consistency, sample-complexity or impossibility theorem),
#               "theory+algorithm", or "method"
#   root        the Lean package, the root of its code and, by default, the paper's name: the
#               method's name, otherwise first author and year (lean4-phylogenetics'
#               docs/CONVENTIONS.md, Section 2)
#   paper       optional: the paper's name, when it is not the root (CONVENTIONS, Section 2)
#   status      "todo", "partial" (some results are formalized elsewhere: see covered_by),
#               "in-progress" (its repository exists), or "formalized"
#   repo        only when the repository is not named lean4-<id>, as for papers on one topic that
#               share a repository (CONVENTIONS, Section 3)
#   commit      for a formalized paper: the commit that other repositories require
#   uses        other hubs whose library its formalization requires, besides this one
#   builds_on   ids of papers, of any hub's catalog, whose results its proofs use. Only what is known
#               before the paper's inventory; its Phase 1 completes the list here
#   covered_by  what is already formalized, and where
#   note        anything else

[[family]]
id = 1
title = "Fast convergence and information-theoretic sample complexity"
priority = "highest"

[[family]]
id = 2
title = "Statistical consistency and model misspecification"

[[family]]
id = 3
title = "Gene-tree discordance and limits of species-tree inference"

[[family]]
id = 4
title = "Identifiability and consistency under insertion–deletion models"
priority = "high"

[[family]]
id = 5
title = "Asymptotic inference near singularities and boundaries"

